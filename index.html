<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DINGTREN Claim Hub v5.0</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0f172a;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--background);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px 10px; 
            margin: 0; 
            display: flex;
            justify-content: center;
            color: var(--text-main);
            min-height: 100vh;
        }

        .app-card { 
            width: 100%;
            max-width: 540px; 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-lg); 
            overflow: hidden; 
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .header { 
            background: var(--secondary); 
            color: white; 
            padding: 24px 20px; 
            text-align: center; 
            position: relative;
            border-bottom: 4px solid var(--primary);
        }
        
        .header h2 { 
            margin: 0; 
            font-size: 20px; 
            font-weight: 800;
            letter-spacing: 0.5px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px;
        }
        
        .v4-badge { 
            background: rgba(79, 70, 229, 0.2); 
            color: #a5b4fc; 
            font-size: 10px; 
            font-weight: 800; 
            padding: 4px 10px; 
            border-radius: 20px; 
            letter-spacing: 1px;
            border: 1px solid rgba(79, 70, 229, 0.5);
            text-transform: uppercase;
        }

        .upload-section { background: #f8fafc; padding: 24px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .upload-section label { font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;}
        input[type="file"] { font-size: 13px; width: 100%; padding: 12px; background: white; border-radius: var(--radius-md); border: 2px dashed #cbd5e1; cursor: pointer; color: var(--text-muted); transition: all 0.2s;}
        input[type="file"]:hover { border-color: var(--primary); background: #fefeff; }

        .status-badge { display: inline-block; margin-top: 12px; padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; background: #f1f5f9; color: var(--text-muted); }
        .status-success { background: var(--success); color: white; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2); }

        #reader-container { background: #000; display: none; position: relative; border-radius: var(--radius-md); margin: 15px; overflow: hidden; box-shadow: var(--shadow-md);}
        #reader { width: 100%; }
        .close-cam { width: 100%; background: var(--danger); color: white; border: none; padding: 12px; cursor: pointer; font-weight: 700; font-size: 12px; letter-spacing: 1px; }

        .content { padding: 25px 20px; }
        .field-group { margin-bottom: 28px; position: relative; }
        .field-group label { display: flex; align-items: center; font-size: 12px; font-weight: 700; color: var(--secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input[type="text"], select, textarea { flex: 1; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 14px; font-family: 'SF Mono', monospace; font-weight: 500; background: #fff; transition: all 0.2s ease; width: 100%; box-sizing: border-box; color: var(--text-main); box-shadow: var(--shadow-sm);}
        input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);}
        textarea { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; resize: vertical; min-height: 140px; line-height: 1.6; }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        .data-pill { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; flex-direction: column; gap: 4px;}
        .data-pill span { font-size: 14px; color: var(--text-main); font-family: monospace; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .success-pill { background: #f0fdf4; border-color: #86efac; }
        .success-pill span { color: #166534; }
        .error-pill { background: #fef2f2; border-color: #fca5a5; }
        .error-pill span { color: #991b1b; }

        .btn-row { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px 16px; border: 1px solid transparent; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        button:active { transform: scale(0.97); }

        .btn-scan { background: var(--secondary); color: white; box-shadow: var(--shadow-sm); }
        .btn-copy { background: white; border-color: var(--border); color: var(--text-main); box-shadow: var(--shadow-sm);}
        .btn-copy-sub { background: var(--success); color: white; white-space: nowrap; padding: 14px 20px;}
        
        .radio-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; background: #f8fafc; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border);}
        .radio-group label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-main); font-weight: 600; cursor: pointer; margin: 0;}

        .clear-btn { width: 100%; background: transparent; color: var(--text-muted); margin-top: 25px; border: 1px dashed #cbd5e1; font-size: 12px; padding: 16px; border-radius: var(--radius-md); cursor: pointer;}
        .clear-btn:hover { background: #f8fafc; color: var(--danger); border-color: var(--danger);}

        .ai-dashboard { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-top: 15px; }
        .ai-stats { display: flex; gap: 12px; margin-bottom: 15px; }
        .stat-box { flex: 1; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 15px 10px; text-align: center; box-shadow: var(--shadow-sm);}
        .stat-box h3 { margin: 0; font-size: 24px; color: var(--primary); font-weight: 800; }
        .stat-box p { margin: 4px 0 0; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .history-list { max-height: 180px; overflow-y: auto; font-size: 12px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px; }
        .history-item { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;}
        .history-item:last-child { border-bottom: none; }
        
        .btn-log { background: var(--text-main); color: white; width: 100%; margin-bottom: 15px; box-shadow: var(--shadow-md);}
        .btn-log:hover { background: #0f172a; }

        #btn-push-meesho { 
            width: 100%; 
            margin-top: 12px; 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border-radius: var(--radius-md); 
            font-weight: 700; 
            font-size: 14px; 
            border: none; 
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4); 
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        #btn-push-meesho:hover { background: var(--primary-hover); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6); transform: translateY(-1px);}

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .divider { height: 1px; background: var(--border); margin: 25px 0; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h2>DINGTREN CLAIM HUB <span class="v4-badge">v5.0 Sonic</span></h2>
    </div>

    <div class="upload-section">
        <label>📄 Load Excel/CSV Master Report</label>
        <input type="file" id="excelFile" accept=".csv, .xlsx, .xls">
        <div id="fileStatus" class="status-badge">Awaiting File...</div>
    </div>

    <div id="reader-container">
        <div id="reader"></div>
        <button type="button" class="close-cam" onclick="stopScanner()">Close Scanner</button>
    </div>

    <div class="content">
        <!-- 1. AWB SCAN -->
        <div class="field-group">
            <label>1. AWB Tracking Number</label>
            <div class="input-row">
                <input type="text" id="awb" placeholder="Scan or Type..." oninput="manualAwbCheck()">
            </div>
            <div class="btn-row">
                <button type="button" class="btn-scan" onclick="startScanner('awb')">📷 Scan AWB</button>
                <button type="button" class="btn-copy" onclick="copy('awb')">📋 Copy</button>
            </div>
            <div id="duplicateWarning" style="color: var(--danger); font-size: 12px; font-weight: 600; display: none; margin-top: 10px; background: #fef2f2; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid #fecaca;">⚠️ Duplicate Warning: You have already logged this AWB today.</div>
        </div>

        <!-- 2. AUTO-FILLED DATA -->
        <div class="field-group">
            <label>2. Order Details (Auto-Synced)</label>
            <div class="input-row">
                <input type="text" id="subid" placeholder="Sub-Order ID" readonly>
                <button type="button" class="btn-copy-sub" onclick="copy('subid')">✅ Copy ID</button>
            </div>
            
            <div class="data-grid">
                <div class="data-pill" id="pill-sku">SKU ID<span id="txt-sku">Waiting...</span></div>
                <div class="data-pill" id="pill-qty">Quantity<span id="txt-qty">-</span></div>
            </div>
            <div class="data-pill" id="pill-reason" style="margin-bottom: 10px;">
                Meesho Listed Reason<span id="txt-reason">Waiting...</span>
            </div>
            
            <input type="hidden" id="sku"><input type="hidden" id="qty"><input type="hidden" id="fileReason">
        </div>

        <div class="divider"></div>

        <!-- 3. PACKET ID -->
        <div class="field-group">
            <label>3. Packet ID verification</label>
            <div class="input-row">
                <input type="text" id="pid" placeholder="Scan Packet ID..." oninput="generateTicket()">
            </div>
            <div class="btn-row">
                <button type="button" class="btn-scan" onclick="startScanner('pid')" style="background: #334155;">📷 Scan Packet</button>
                <button type="button" class="btn-copy" onclick="copy('pid')">📋 Copy</button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- 4. CAMERA -->
        <div class="field-group">
            <label>4. Evidence Capture (Always On)</label>
            <div id="live-media-container" style="background: #000; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-md);">
                <video id="live-media-feed" autoplay playsinline muted style="width: 100%; display: block; object-fit: cover; max-height: 280px;"></video>
                <div style="padding: 12px; display: flex; gap: 10px; background: #1e293b;">
                    <button type="button" id="btn-snap" style="background: var(--primary); color: white;" onclick="captureLivePhoto()">📸 SNAP PHOTO</button>
                    <button type="button" id="btn-rec-start" style="background: var(--danger); color: white;" onclick="startLiveRecording()">🔴 REC (23MB)</button>
                    <button type="button" id="btn-rec-stop" style="display: none; background: var(--success); color: white;" onclick="stopLiveRecording()">⏹️ STOP & SAVE</button>
                </div>
            </div>
            <div id="mediaStatus" style="font-size: 13px; font-weight: 600; color: var(--text-muted); margin-top: 12px; text-align: center; background: #f8fafc; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border);">Connecting to camera...</div>
        </div>

        <div class="divider"></div>

        <!-- 5. TICKET GENERATOR -->
        <div class="field-group">
            <label>5. Smart Ticket Generator</label>
            <div class="radio-group">
                <label><input type="radio" name="returnType" value="RTO" onchange="toggleReason(); generateTicket()"> Courier Return (RTO)</label>
                <label><input type="radio" name="returnType" value="Customer Return" onchange="toggleReason(); generateTicket()"> Customer Return</label>
            </div>

            <div id="reasonContainer" style="display: none; margin-bottom: 12px;">
                <select id="returnReason" onchange="generateTicket()">
                    <option value="" disabled selected>Select Claim Reason...</option>
                    <option value="I have received wrong return">Received wrong return</option>
                    <option value="I have received damaged return">Received damaged return</option>
                    <option value="I have not received my Return/RTO shipment">Did not receive shipment</option>
                    <option value="Item/s are missing in my return">Items are missing</option>
                    <option value="I have received a wrong barcoded package in RTO">Wrong barcoded package</option>
                    <option value="I have received used product as return">Received used product</option>
                    <option value="Return/RTO product not received but marked delivered">Marked delivered but not received</option>
                    <option value="Return/RTO Delivery Issue - False Attempt by Logistic Partner">False Attempt by Courier</option>
                    <option value="Size related issue">Size related issue</option>
                    <option value="Other Returns/RTO and Exchange related issue">Other Issue</option>
                </select>
            </div>

            <textarea id="ticketMessage" placeholder="Generated ticket will appear here..." readonly></textarea>
            <button type="button" id="btn-push-meesho" onclick="copy('ticketMessage')">COPY TICKET TO CLIPBOARD</button>
        </div>

        <div class="divider"></div>

        <!-- 6. DASHBOARD -->
        <div class="field-group" style="margin-bottom: 0;">
            <label>6. Local Database Log</label>
            <button type="button" class="btn-log" onclick="logCurrentClaim()">💾 Save Record & Clear Fields</button>
            
            <div class="ai-dashboard">
                <div class="ai-stats">
                    <div class="stat-box"><h3 id="stat-total">0</h3><p>Total</p></div>
                    <div class="stat-box"><h3 id="stat-rto">0</h3><p>RTO</p></div>
                    <div class="stat-box"><h3 id="stat-cr">0</h3><p>Cust Ret</p></div>
                </div>
                <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">RECENT ACTIVITY:</div>
                <div class="history-list" id="history-container">
                    <div style="padding: 15px; text-align: center; color: var(--text-muted); font-weight: 500;">No claims logged today.</div>
                </div>
                
                <div class="btn-row" style="margin-top: 15px;">
                    <button type="button" style="background: var(--success); color: white;" onclick="exportToCSV()">📊 Download CSV</button>
                    <button type="button" style="background: white; color: var(--danger); border: 1px solid var(--danger);" onclick="clearDatabase()">🗑️ Erase DB</button>
                </div>
            </div>
        </div>

        <button type="button" class="clear-btn" onclick="clearForm()">Reset All Fields</button>
    </div>
</div>

<script>
    // --- 🎧 ADVANCED WEB AUDIO API SYNTHESIZER ENGINE ---
    const SoundFX = {
        ctx: null,
        init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        playScan() {
            this.init(); const now = this.ctx.currentTime;
            let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1320, now + 0.05);
            gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(now + 0.15);
        },
        playCopy() {
            this.init(); const now = this.ctx.currentTime;
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((f, i) => {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.04);
                gain.gain.setValueAtTime(0.05, now + i * 0.04); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.18);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.04); osc.stop(now + i * 0.04 + 0.18);
            });
        },
        playError() {
            this.init(); const now = this.ctx.currentTime;
            [160, 140].forEach((f, i) => {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.1);
                gain.gain.setValueAtTime(0.12, now + i * 0.1); gain.gain.linearRampToValueAtTime(0.001, now + i * 0.1 + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.12);
            });
        },
        playSave() {
            this.init(); const now = this.ctx.currentTime;
            const freqs = [587.33, 783.99, 1174.66, 1567.98];
            freqs.forEach((f, i) => {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.05);
                gain.gain.setValueAtTime(0.06, now + i * 0.05); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.25);
            });
        }
    };

    window.onload = function() {
        updateDashboard(); 
        document.getElementById('awb').focus(); 
        initAlwaysOnCamera(); 
    };

    // --- CAMERA STREAM ENGINE ---
    let globalMediaStream = null; let liveMediaRecorder = null; let recordedChunks = []; let sizeCheckInterval = null;

    async function initAlwaysOnCamera() {
        const video = document.getElementById('live-media-feed'); const status = document.getElementById('mediaStatus');
        if (globalMediaStream) return;
        try {
            status.innerText = "Accessing camera...";
            globalMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
        } catch (err) {
            try {
                globalMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            } catch (err2) {
                status.innerText = "Camera Access Blocked. Update browser permissions."; status.style.color = "var(--danger)"; return;
            }
        }
        video.srcObject = globalMediaStream; video.play().catch(e => console.log(e));
        status.innerText = "🟢 Camera Engine Synced. System Ready."; status.style.color = "var(--success)";
    }

    function captureLivePhoto() {
        if (!globalMediaStream) { alert("Camera system offline. Reconnecting..."); initAlwaysOnCamera(); return; }
        const video = document.getElementById('live-media-feed'); const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1280; canvas.height = video.videoHeight || 720;
        const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob((blob) => {
            if(!blob) return; const url = URL.createObjectURL(blob); const a = document.createElement('a');
            const ts = new Date().getTime(); const awbVal = document.getElementById('awb').value || "Claim";
            a.download = `Photo_${awbVal}_${ts}.jpg`; a.href = url;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            
            setTimeout(() => { URL.revokeObjectURL(url); ctx.clearRect(0, 0, canvas.width, canvas.height); }, 1000);
            SoundFX.playScan();
            
            const status = document.getElementById('mediaStatus'); status.innerHTML = `✅ Snap Saved to Storage Engine`;
            setTimeout(() => { if(globalMediaStream) { status.innerText = "🟢 Camera Engine Synced. System Ready."; status.style.color = "var(--success)"; } }, 2000);
        }, 'image/jpeg', 0.85);
    }

    function startLiveRecording() {
        if (!globalMediaStream) return alert("Camera feed inactive."); recordedChunks = [];
        let options = { mimeType: 'video/mp4' };
        if (!MediaRecorder.isTypeSupported('video/mp4')) options = { mimeType: 'video/webm' };
        try { liveMediaRecorder = new MediaRecorder(globalMediaStream, options); } catch (e) {
            try { liveMediaRecorder = new MediaRecorder(globalMediaStream); } catch (err) { return alert("Codec unsupported."); }
        }
        document.getElementById('btn-snap').style.display = 'none'; document.getElementById('btn-rec-start').style.display = 'none'; document.getElementById('btn-rec-stop').style.display = 'block';
        const status = document.getElementById('mediaStatus'); status.innerHTML = `🔴 RECORDING: 0.00 MB / 23.00 MB`; status.style.color = "var(--danger)";
        liveMediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
        liveMediaRecorder.start(250);
        sizeCheckInterval = setInterval(() => {
            const sizeMB = (new Blob(recordedChunks).size / (1024 * 1024)).toFixed(2);
            status.innerHTML = `🔴 RECORDING: ${sizeMB} MB / 23.00 MB`; if (sizeMB >= 23.00) stopLiveRecording(true);
        }, 250);
    }

    function stopLiveRecording(limitHit = false) {
        if (liveMediaRecorder && liveMediaRecorder.state !== "inactive") liveMediaRecorder.stop();
        clearInterval(sizeCheckInterval);
        document.getElementById('btn-snap').style.display = 'block'; document.getElementById('btn-rec-start').style.display = 'block'; document.getElementById('btn-rec-stop').style.display = 'none';
        const status = document.getElementById('mediaStatus'); status.innerText = "Compiling visual container..."; status.style.color = "var(--text-muted)";
        
        setTimeout(() => {
            const finalBlob = new Blob(recordedChunks, { type: liveMediaRecorder.mimeType || 'video/mp4' });
            const finalSizeMB = (finalBlob.size / (1024 * 1024)).toFixed(2);
            const url = URL.createObjectURL(finalBlob); const a = document.createElement('a');
            const ts = new Date().getTime(); const awbVal = document.getElementById('awb').value || "Claim";
            let ext = finalBlob.type.includes("webm") ? "webm" : "mp4";
            a.download = `Video_${awbVal}_${ts}.${ext}`; a.href = url;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            
            setTimeout(() => { URL.revokeObjectURL(url); recordedChunks = []; }, 2000);
            SoundFX.playSave();
            
            status.innerHTML = limitHit ? `✅ Automated strict size boundary ceiling met (${finalSizeMB} MB)` : `✅ Video Container Packaged (${finalSizeMB} MB)`;
            status.style.color = "var(--success)";
            setTimeout(() => { if(globalMediaStream) status.innerText = "🟢 Camera Engine Synced. System Ready."; }, 3000);
        }, 500); 
    }

    // --- BARCODE SCANNER MECHANICS ---
    async function startScanner(targetField) {
        if (globalMediaStream) {
            globalMediaStream.getTracks().forEach(track => track.stop()); globalMediaStream = null;
            document.getElementById('live-media-feed').srcObject = null;
            document.getElementById('mediaStatus').innerText = "Handoff context active: Primary camera feed paused.";
        }
        currentTarget = targetField; document.getElementById('reader-container').style.display = 'block';
        if (html5QrCode && html5QrCode.isScanning) await html5QrCode.stop();
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 260, height: 160 } }, (decodedText) => {
            const text = String(decodedText).trim();
            if (currentTarget === 'awb' && (text.includes('http') || text.includes('{'))) return;
            document.getElementById(currentTarget).value = text;
            if (currentTarget === 'awb') { findSubOrderId(text); checkDuplicate(text); }
            generateTicket(); stopScanner(); SoundFX.playScan();
        }).catch(err => alert("Lenses initialization error. Check security flags."));
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => { 
                document.getElementById('reader-container').style.display = 'none'; setTimeout(initAlwaysOnCamera, 400);
            });
        } else {
            document.getElementById('reader-container').style.display = 'none'; setTimeout(initAlwaysOnCamera, 400);
        }
    }

    // --- DATA PIPELINE PARSING ---
    let excelData = []; 
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            excelData = XLSX.utils.sheet_to_json(XLSX.read(data, {type: 'array'}).Sheets[XLSX.read(data, {type: 'array'}).SheetNames[0]], {header: 1});
            const statusBadge = document.getElementById('fileStatus');
            statusBadge.innerText = `✅ Database Connected (${excelData.length} Vectors)`; statusBadge.className = "status-badge status-success";
            SoundFX.playSave();
        }; reader.readAsArrayBuffer(file);
    });

    function findSubOrderId(awbScanned) {
        if (excelData.length === 0) return; const cleanAwb = String(awbScanned).trim().toUpperCase();
        let foundSubId = null; let foundSku = null; let foundQty = null; let foundReason = null;
        for (let r = 0; r < excelData.length; r++) {
            if (excelData[r].join("|||").toUpperCase().includes(cleanAwb)) {
                if (excelData[r].length > 8) foundSubId = String(excelData[r][8]).trim();  
                if (excelData[r].length > 2) foundSku = String(excelData[r][2]).trim();    
                if (excelData[r].length > 6) foundQty = String(excelData[r][6]).trim();  
                if (excelData[r].length > 19) foundReason = String(excelData[r][19]).trim(); 
                break; 
            }
        }
        const subIdBox = document.getElementById('subid'); const skuBox = document.getElementById('sku'); const qtyBox = document.getElementById('qty'); const reasonBox = document.getElementById('fileReason');
        const pSku = document.getElementById('pill-sku'); const pQty = document.getElementById('pill-qty'); const pReason = document.getElementById('pill-reason');
        const tSku = document.getElementById('txt-sku'); const tQty = document.getElementById('txt-qty'); const tReason = document.getElementById('txt-reason');

        if (foundSubId && foundSubId !== "undefined" && foundSubId !== "") {
            subIdBox.value = foundSubId; skuBox.value = foundSku || "N/A"; qtyBox.value = foundQty || "1"; reasonBox.value = foundReason || "N/A";
            tSku.innerText = skuBox.value; tQty.innerText = qtyBox.value; tReason.innerText = reasonBox.value;
            subIdBox.style.borderColor = "var(--success)"; subIdBox.style.backgroundColor = "#f0fdf4";
            pSku.className = "data-pill success-pill"; pQty.className = "data-pill success-pill"; pReason.className = "data-pill success-pill";
            SoundFX.playScan();
        } else {
            subIdBox.value = "NOT FOUND"; skuBox.value = ""; qtyBox.value = ""; reasonBox.value = "";
            tSku.innerText = "No Data"; tQty.innerText = "-"; tReason.innerText = "No Data";
            subIdBox.style.borderColor = "var(--danger)"; subIdBox.style.backgroundColor = "#fef2f2";
            pSku.className = "data-pill error-pill"; pQty.className = "data-pill error-pill"; pReason.className = "data-pill error-pill";
            SoundFX.playError();
        }
        generateTicket(); 
    }

    function manualAwbCheck() { const val = document.getElementById('awb').value.trim(); findSubOrderId(val); checkDuplicate(val); generateTicket(); }

    function copy(id) {
        const field = document.getElementById(id); if(!field.value || field.value.includes("NOT FOUND")) return;
        field.select(); document.execCommand('copy'); SoundFX.playCopy();
        if(id === 'ticketMessage') {
            const btn = document.getElementById('btn-push-meesho'); const orig = btn.innerText;
            btn.innerText = "✨ COPIED TO SYSTEM CLIPBOARD!"; btn.style.background = "var(--success)";
            setTimeout(() => { btn.innerText = orig; btn.style.background = "var(--primary)"; }, 2000);
        } else {
            const originalBg = field.style.background; field.style.background = "#fef08a";
            setTimeout(() => { field.style.background = originalBg; }, 500);
        }
    }

    // --- DATA STORAGE ENFORCEMENT ---
    function checkDuplicate(awbCheck) {
        const isDupe = smartDB.some(item => item.awb === awbCheck && item.awb !== "");
        document.getElementById('duplicateWarning').style.display = isDupe ? 'block' : 'none';
        if (isDupe) {
            document.getElementById('awb').style.borderColor = "var(--danger)"; document.getElementById('awb').style.backgroundColor = "#fef2f2";
            SoundFX.playError();
        } else {
            document.getElementById('awb').style.borderColor = "var(--border)"; document.getElementById('awb').style.backgroundColor = "#fff";
        }
    }

    function logCurrentClaim() {
        const awb = document.getElementById('awb').value; const subid = document.getElementById('subid').value;
        if (!awb || awb.length < 5) return alert("Validation tracking exception rule tripped: tracking metric null.");
        if (smartDB.some(item => item.awb === awb) && !confirm("Override identical primary key log item data stack index entry constraint?")) return;

        smartDB.push({ date: new Date().toLocaleString(), awb, subid, type: document.querySelector('input[name="returnType"]:checked')?.value || "Uncategorized" });
        localStorage.setItem('dingtrenSmartDB', JSON.stringify(smartDB));
        SoundFX.playSave(); updateDashboard(); clearForm(); 
    }

    function updateDashboard() {
        document.getElementById('stat-total').innerText = smartDB.length;
        document.getElementById('stat-rto').innerText = smartDB.filter(i => i.type === 'RTO').length;
        document.getElementById('stat-cr').innerText = smartDB.filter(i => i.type === 'Customer Return').length;
        const container = document.getElementById('history-container');
        if (smartDB.length === 0) { container.innerHTML = `<div style="padding: 15px; text-align: center; color: var(--text-muted); font-weight: 500;">Logs clean. Array index initialization at zero.</div>`; return; }
        container.innerHTML = smartDB.slice().reverse().map(item => `<div class="history-item"><div><b style="color: var(--text-main)">${item.awb}</b><br><span style="color:var(--text-muted); font-size:10px;">${item.date}</span></div><div style="color: var(--primary); font-weight:700; background: #e0e7ff; padding: 4px 8px; border-radius: 6px; font-size:10px;">${item.type}</div></div>`).join('');
    }

    function exportToCSV() {
        if (smartDB.length === 0) return alert("Array index pointer exception: index empty.");
        let csvContent = "data:text/csv;charset=utf-8,Date,AWB,Sub-Order ID,Return Type\n" + smartDB.map(e => `"${e.date}","${e.awb}","${e.subid}","${e.type}"`).join("\n");
        const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `DINGTREN_Claim_Report_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function clearDatabase() { if(confirm("Wipe completely?")) { smartDB = []; localStorage.setItem('dingtrenSmartDB', JSON.stringify(smartDB)); updateDashboard(); clearForm(); } }

    function clearForm() {
        document.getElementById('awb').value = ''; document.getElementById('subid').value = ''; document.getElementById('pid').value = ''; document.getElementById('sku').value = ''; document.getElementById('qty').value = ''; document.getElementById('fileReason').value = '';
        document.getElementById('txt-sku').innerText = "Waiting..."; document.getElementById('txt-qty').innerText = "-"; document.getElementById('txt-reason').innerText = "Waiting...";
        document.getElementById('pill-sku').className = "data-pill"; document.getElementById('pill-qty').className = "data-pill"; document.getElementById('pill-reason').className = "data-pill";
        ['subid', 'awb'].forEach(id => { const el = document.getElementById(id); if(el) { el.style.borderColor = "var(--border)"; el.style.backgroundColor = "#fff"; } });
        document.getElementById('ticketMessage').value = ''; document.getElementById('returnReason').selectedIndex = 0; document.getElementById('duplicateWarning').style.display = 'none';
        const rtoRadio = document.querySelector('input[name="returnType"][value="RTO"]'); const crRadio = document.querySelector('input[name="returnType"][value="Customer Return"]');
        if(rtoRadio) rtoRadio.checked = false; if(crRadio) crRadio.checked = false; document.getElementById('reasonContainer').style.display = 'none';
        document.getElementById('awb').focus(); 
    }

    function toggleReason() { document.getElementById('reasonContainer').style.display = document.querySelector('input[name="returnType"][value="RTO"]').checked ? 'none' : 'block'; }

    function generateTicket() {
        const awb = document.getElementById('awb').value || "[Scan AWB]"; const subId = document.getElementById('subid').value || "[Scan to Auto-fill]";
        const sku = document.getElementById('sku').value && document.getElementById('sku').value !== "N/A" ? document.getElementById('sku').value : "";
        const qty = document.getElementById('qty').value && document.getElementById('qty').value !== "N/A" ? document.getElementById('qty').value : "";
        const fileReason = document.getElementById('fileReason').value && document.getElementById('fileReason').value !== "N/A" ? document.getElementById('fileReason').value : "";
        const pid = document.getElementById('pid').value; const pidText = pid ? `\nPacket ID: ${pid}` : "";
        const returnType = document.querySelector('input[name="returnType"]:checked')?.value;
        let detailedIssue = "";

        if (!returnType) detailedIssue = "Complete parameter checklist mapping profile: select ticket classification branch context.";
        else if (returnType === "RTO") detailedIssue = `Issue: RTO Shipment Problem\n\nDescription:\n1. Packaging standard: The product was dispatched in a high-burst-strength 3-ply corrugated box.\n2. Product Nature: High-grade plastic bangle box.\n3. Evidence: I have received an RTO package, but upon opening it on camera, it was found to be damaged/tampered due to courier mishandling during transit.\n\nRequest: Please review the attached unboxing video and approve this claim under the Seller Protection Fund (SPF) due to clear logistic negligence.`;
        else {
            const reason = document.getElementById('returnReason').value;
            if (!reason) detailedIssue = "Parameter value flag string exception missing: drop dropdown focus value.";
            else {
                switch(reason) {
                    case "I have received damaged return": detailedIssue = `Issue: Received Damaged Return\n\nDescription:\n1. Packaging standard: The product was shipped in a high-burst-strength 3-ply corrugated box (industry standard).\n2. Product Nature: This is a high-grade plastic bangle box.\n3. Evidence of Negligence: The cracks/breaks occurred due to extreme external pressure and courier mishandling during transit, which exceeded the protection of a 3-ply box.\n4. Compliance: I have followed all Meesho packaging guidelines. The unboxing video clearly shows the outer package was damaged/mishandled.\n\nRequest: Please approve this claim under the Seller Protection Fund (SPF) as this is a clear case of courier negligence.`; break;
                    case "I have received wrong return": detailedIssue = `Issue: Received Wrong Return\n\nDescription:\nInstead of the high-grade plastic bangle box that was originally dispatched, I have received a completely different and incorrect item. The attached unboxing video clearly demonstrates the intact return packaging being opened to reveal the fraudulent item inside.\n\nRequest: This is a clear case of fraud. Please investigate and approve my SPF claim.`; break;
                    case "Item/s are missing in my return": detailedIssue = `Issue: Items Missing in Return\n\nDescription:\nThe returned package was received partially empty. Some plastic bangle box units from the original order are missing. The continuous unboxing video clearly shows the sealed package being opened and the exact deficit in contents.\n\nRequest: Please process the SPF claim for the missing units based on the attached video evidence.`; break;
                    case "I have received used product as return": detailedIssue = `Issue: Received Used Product\n\nDescription:\nThe customer has returned a used/degraded item instead of the brand new plastic bangle box that was dispatched. This violates the return policy. The unboxing video is attached for your reference.\n\nRequest: Please approve the SPF claim for this unacceptable customer return.`; break;
                    default: detailedIssue = `Issue: ${reason}\n\nDescription:\nI am raising an issue regarding this order. I have securely packaged the original plastic bangle box following all Meesho guidelines. Please review the specific details in the attached unboxing video/photos which serve as clear evidence of the issue at hand.\n\nRequest: Kindly investigate this matter and process the SPF claim accordingly.`;
                }
            }
        }
        let template = `Dear Meesho Support,\n\nAWB Number: ${awb}\nSub-Order ID: ${subId}`;
        if(sku) template += `\nSKU: ${sku}`; if(qty) template += `\nQuantity: ${qty}`; if(fileReason) template += `\nMeesho Listed Reason: ${fileReason}`;
        template += `${pidText}\n\n${detailedIssue}`; document.getElementById('ticketMessage').value = template;
    }
</script>
