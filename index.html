<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DINGTREN Claim Hub v6.1</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #0f172a;
            --success: #10b981;
            --danger: #f43f5e;
            --surface: rgba(255, 255, 255, 0.85); 
            --border: rgba(255, 255, 255, 0.4);
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            --radius-md: 16px;
            --radius-lg: 24px;
            --shadow-float: 0 20px 40px -15px rgba(0,0,0,0.15);
            --shadow-inner: inset 0 2px 4px rgba(255,255,255,0.7);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body { 
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
            background: linear-gradient(-45deg, #e0c3fc, #8ec5fc, #fbc2eb, #a18cd1);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            padding: 20px 10px; 
            margin: 0; 
            display: flex;
            justify-content: center;
            color: var(--text-main);
            min-height: 100vh;
        }

        .app-card { 
            width: 100%;
            max-width: 540px; 
            background: var(--surface); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-float); 
            overflow: hidden; 
            margin-bottom: 30px;
            border: 1px solid var(--border);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(10px);
            color: white; 
            padding: 24px 20px; 
            text-align: center; 
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h2 { 
            margin: 0; 
            font-size: 22px; 
            font-weight: 800;
            letter-spacing: 0.5px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sound-toggle {
            position: absolute;
            right: 20px;
            top: 24px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
            padding: 0;
        }
        .sound-toggle:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        
        .v6-badge { 
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-text-fill-color: white;
            font-size: 10px; 
            font-weight: 800; 
            padding: 4px 10px; 
            border-radius: 20px; 
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .upload-section { background: rgba(255,255,255,0.5); padding: 24px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .upload-section label { font-weight: 800; color: var(--primary); display: block; margin-bottom: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;}
        input[type="file"] { font-size: 13px; width: 100%; padding: 12px; background: rgba(255,255,255,0.8); border-radius: var(--radius-md); border: 2px dashed #cbd5e1; cursor: pointer; color: var(--text-muted); transition: all 0.3s;}
        input[type="file"]:hover { border-color: var(--primary); background: #fff; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.1); }

        .status-badge { display: inline-block; margin-top: 12px; padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.6); color: var(--text-muted); box-shadow: var(--shadow-inner); }
        .status-success { background: var(--success); color: white; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }

        #reader-container { background: #000; display: none; position: relative; border-radius: var(--radius-md); margin: 15px; overflow: hidden; box-shadow: var(--shadow-float);}
        #reader { width: 100%; }
        .close-cam { width: 100%; background: var(--danger); color: white; border: none; padding: 16px; cursor: pointer; font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

        .content { padding: 25px 20px; }
        .field-group { margin-bottom: 28px; position: relative; animation: slideUp 0.5s ease backwards; }
        
        .field-group label { display: flex; align-items: center; font-size: 12px; font-weight: 800; color: var(--secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input[type="text"], select, textarea { flex: 1; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.6); border-radius: var(--radius-md); font-size: 14px; font-family: 'SF Mono', monospace; font-weight: 600; background: rgba(255,255,255,0.7); transition: all 0.3s ease; width: 100%; box-sizing: border-box; color: var(--text-main); box-shadow: var(--shadow-inner);}
        input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);}
        textarea { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 500; resize: vertical; min-height: 140px; line-height: 1.6; }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .data-pill { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.8); border-radius: var(--radius-md); padding: 12px; font-size: 12px; color: var(--text-muted); font-weight: 700; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow-inner);}
        .data-pill span { font-size: 14px; color: var(--text-main); font-family: monospace; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .success-pill { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); }
        .success-pill span { color: #047857; }
        .error-pill { background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.3); }
        .error-pill span { color: #be123c; }

        .btn-row { display: flex; gap: 10px; }
        button { flex: 1; padding: 14px 16px; border: 1px solid transparent; border-radius: var(--radius-md); font-weight: 800; cursor: pointer; font-size: 13px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: 0.5px;}
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        button:active { transform: translateY(1px); box-shadow: none; }

        .btn-scan { background: var(--secondary); color: white; }
        .btn-copy { background: rgba(255,255,255,0.8); border: 1px solid var(--border); color: var(--text-main); }
        .btn-copy-sub { background: var(--success); color: white; white-space: nowrap; padding: 14px 20px;}
        .btn-media { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn-media:hover { background: var(--primary-hover); }
        
        .radio-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; background: rgba(255,255,255,0.5); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border);}
        .radio-group label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-main); font-weight: 700; cursor: pointer; margin: 0;}

        .clear-btn { width: 100%; background: transparent; color: var(--text-muted); margin-top: 25px; border: 2px dashed #cbd5e1; font-size: 12px; padding: 16px; border-radius: var(--radius-md); cursor: pointer;}
        .clear-btn:hover { background: rgba(255,255,255,0.8); color: var(--danger); border-color: var(--danger);}

        .ai-dashboard { background: rgba(255,255,255,0.5); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-top: 15px; box-shadow: var(--shadow-inner); }
        .ai-stats { display: flex; gap: 12px; margin-bottom: 15px; }
        .stat-box { flex: 1; background: #fff; border: 1px solid rgba(255,255,255,0.8); border-radius: var(--radius-md); padding: 15px 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03);}
        .stat-box h3 { margin: 0; font-size: 24px; color: var(--primary); font-weight: 800; }
        .stat-box p { margin: 4px 0 0; font-size: 10px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        
        .history-list { max-height: 180px; overflow-y: auto; font-size: 12px; background: rgba(255,255,255,0.8); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px; }
        .history-item { padding: 10px 12px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;}
        .history-item:last-child { border-bottom: none; }
        
        .btn-log { background: var(--text-main); color: white; width: 100%; margin-bottom: 15px; }

        #btn-push-meesho { 
            width: 100%; margin-top: 12px; padding: 18px; 
            background: linear-gradient(135deg, #6366f1, #4f46e5); 
            color: white; border-radius: var(--radius-md); 
            font-weight: 800; font-size: 14px; border: none; 
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); 
            text-transform: uppercase; letter-spacing: 1px;
        }
        #btn-push-meesho:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(99, 102, 241, 0.4); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(0,0,0,0.1), transparent); margin: 25px 0; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h2>DINGTREN CLAIM HUB <span class="v6-badge">v6.1 Fixed</span></h2>
        <button id="soundToggle" class="sound-toggle" onclick="SoundFX.toggleMute()" title="Toggle Sound">🔊</button>
    </div>

    <div class="upload-section">
        <label>📄 Load Excel/CSV Master Report</label>
        <input type="file" id="excelFile" accept=".csv, .xlsx, .xls" onclick="SoundFX.playTick()">
        <div id="fileStatus" class="status-badge">Awaiting File Data...</div>
    </div>

    <div id="reader-container">
        <div id="reader"></div>
        <button type="button" class="close-cam" onclick="stopScanner()">Stop Scanner</button>
    </div>

    <div class="content">
        <div class="field-group">
            <label>1. AWB Tracking Number</label>
            <div class="input-row">
                <input type="text" id="awb" placeholder="Scan or Type..." oninput="manualAwbCheck()" onclick="SoundFX.playTick()">
            </div>
            <div class="btn-row">
                <button type="button" class="btn-scan" onclick="startScanner('awb')">📷 Scan AWB</button>
                <button type="button" class="btn-copy" onclick="copy('awb')">📋 Copy</button>
            </div>
            <div id="duplicateWarning" style="color: var(--danger); font-size: 12px; font-weight: 700; display: none; margin-top: 10px; background: #fff1f2; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid #fecdd3;">⚠️ Warning: You have already logged this AWB today.</div>
        </div>

        <div class="field-group">
            <label>2. Order Details (Auto-Synced)</label>
            <div class="input-row">
                <input type="text" id="subid" placeholder="Sub-Order ID" readonly onclick="SoundFX.playTick()">
                <button type="button" class="btn-copy-sub" onclick="copy('subid')">✅ Copy ID</button>
            </div>
            
            <div class="data-grid">
                <div class="data-pill" id="pill-sku">SKU ID<span id="txt-sku">Waiting...</span></div>
                <div class="data-pill" id="pill-qty">Quantity<span id="txt-qty">-</span></div>
            </div>
            <div class="data-pill" id="pill-reason" style="margin-bottom: 10px;">
                Meesho Listed Reason<span id="txt-reason">Waiting...</span>
            </div>
            
            <input type="hidden" id="sku"><input type="hidden" id="qty"><input type="hidden" id="fileReason">
        </div>

        <div class="divider"></div>

        <div class="field-group">
            <label>3. Packet ID verification</label>
            <div class="input-row">
                <input type="text" id="pid" placeholder="Scan Packet ID..." oninput="generateTicket()" onclick="SoundFX.playTick()">
            </div>
            <div class="btn-row">
                <button type="button" class="btn-scan" onclick="startScanner('pid')" style="background: #334155;">📷 Scan Packet</button>
                <button type="button" class="btn-copy" onclick="copy('pid')">📋 Copy</button>
            </div>
        </div>

        <div class="divider"></div>

        <div class="field-group">
            <label>4. Evidence Capture</label>
            
            <div class="btn-row" id="camera-start-buttons">
                <button type="button" class="btn-media" onclick="turnOnCamera()">📸 Turn On Camera System</button>
            </div>

            <div id="live-media-container" style="display: none; background: #000; border-radius: var(--radius-md); overflow: hidden; border: 4px solid #1e293b; box-shadow: var(--shadow-float);">
                <video id="live-media-feed" autoplay playsinline muted style="width: 100%; display: block; object-fit: cover; max-height: 280px;"></video>
                <div style="padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; background: #0f172a;">
                    <button type="button" id="btn-snap" style="background: var(--primary); color: white;" onclick="captureLivePhoto()">📸 SNAP</button>
                    <button type="button" id="btn-rec-start" style="background: var(--danger); color: white;" onclick="startLiveRecording()">🔴 REC (23MB)</button>
                    <button type="button" id="btn-rec-stop" style="display: none; background: var(--success); color: white;" onclick="stopLiveRecording()">⏹️ STOP</button>
                    <button type="button" style="background: #475569; color: white;" onclick="turnOffCamera()">❌ CANCEL</button>
                </div>
            </div>
            <div id="mediaStatus" style="font-size: 13px; font-weight: 800; color: var(--text-muted); margin-top: 12px; text-align: center; background: rgba(255,255,255,0.7); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border);">Camera is turned off.</div>
        </div>

        <div class="divider"></div>

        <div class="field-group">
            <label>5. Smart Ticket Generator</label>
            <div class="radio-group">
                <label><input type="radio" name="returnType" value="RTO" onchange="toggleReason(); generateTicket()"> Courier Return (RTO)</label>
                <label><input type="radio" name="returnType" value="Customer Return" onchange="toggleReason(); generateTicket()"> Customer Return</label>
            </div>

            <div id="reasonContainer" style="display: none; margin-bottom: 12px;">
                <select id="returnReason" onchange="generateTicket()" onclick="SoundFX.playTick()" style="width: 100%; padding: 14px; border-radius: var(--radius-md); font-size: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.8); font-weight: 700;">
                    <option value="" disabled selected>Select Claim Reason...</option>
                    <option value="I have received wrong return">Received wrong return</option>
                    <option value="I have received damaged return">Received damaged return</option>
                    <option value="I have not received my Return/RTO shipment">Did not receive shipment</option>
                    <option value="Item/s are missing in my return">Items are missing</option>
                    <option value="I have received a wrong barcoded package in RTO">Wrong barcoded package</option>
                    <option value="I have received used product as return">Received used product</option>
                    <option value="Return/RTO product not received but marked delivered">Marked delivered but not received</option>
                    <option value="Return/RTO Delivery Issue - False Attempt by Logistic Partner">False Attempt by Courier</option>
                    <option value="Size related issue">Size related issue</option>
                    <option value="Other Returns/RTO and Exchange related issue">Other Issue</option>
                </select>
            </div>

            <textarea id="ticketMessage" placeholder="Generated ticket will appear here..." readonly onclick="SoundFX.playTick()"></textarea>
            <button type="button" id="btn-push-meesho" onclick="copy('ticketMessage')">COPY TICKET TO CLIPBOARD</button>
        </div>

        <div class="divider"></div>

        <div class="field-group" style="margin-bottom: 0;">
            <label>6. Local Database Log</label>
            <button type="button" class="btn-log" onclick="logCurrentClaim()">💾 Save Record & Clear Fields</button>
            
            <div class="ai-dashboard">
                <div class="ai-stats">
                    <div class="stat-box"><h3 id="stat-total">0</h3><p>Total</p></div>
                    <div class="stat-box"><h3 id="stat-rto">0</h3><p>RTO</p></div>
                    <div class="stat-box"><h3 id="stat-cr">0</h3><p>Cust Ret</p></div>
                </div>
                <div style="font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px;">RECENT ACTIVITY:</div>
                <div class="history-list" id="history-container">
                    <div style="padding: 15px; text-align: center; color: var(--text-muted); font-weight: 600;">No claims logged today.</div>
                </div>
                
                <div class="btn-row" style="margin-top: 15px;">
                    <button type="button" style="background: var(--success); color: white;" onclick="exportToCSV()">📊 Download CSV</button>
                    <button type="button" style="background: rgba(255,255,255,0.8); color: var(--danger); border: 1px solid var(--danger);" onclick="clearDatabase()">🗑️ Erase DB</button>
                </div>
            </div>
        </div>

        <button type="button" class="clear-btn" onclick="clearForm()">Reset All Fields</button>
    </div>
</div>

<script>
    // --- 🎧 PRO WEB AUDIO API SYNTHESIZER ENGINE ---
    const SoundFX = {
        ctx: null,
        isMuted: false,
        init() { if (!this.ctx && !this.isMuted) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        toggleMute() {
            this.isMuted = !this.isMuted;
            const btn = document.getElementById('soundToggle');
            if (this.isMuted) { btn.innerText = "🔇"; btn.style.background = "rgba(244, 63, 94, 0.2)"; } 
            else { btn.innerText = "🔊"; btn.style.background = "rgba(255,255,255,0.1)"; this.playPop(); }
        },
        playPop() { 
            if(this.isMuted) return; this.init(); const now = this.ctx.currentTime;
            let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.1);
        },
        playTick() { 
            if(this.isMuted) return; this.init(); const now = this.ctx.currentTime;
            let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.05);
        },
        playShutter() { 
            if(this.isMuted) return; this.init(); const now = this.ctx.currentTime;
            let noise = this.ctx.createBufferSource(); let buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.1, this.ctx.sampleRate);
            let data = buffer.getChannelData(0); for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer; let filter = this.ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 1000;
            let gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start(now);
            
            let osc = this.ctx.createOscillator(); let oscGain = this.ctx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.05);
            oscGain.gain.setValueAtTime(0.1, now); oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(oscGain); oscGain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.05);
        },
        playScan() { 
            if(this.isMuted) return; this.init(); const now = this.ctx.currentTime;
            let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1320, now + 0.05);
            gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(now + 0.15);
        },
        playCopy() { 
            if(this.isMuted) return; this.init(); const now = this.ctx.currentTime;
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((f, i) => {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.04);
                gain.gain.setValueAtTime(0.05, now + i * 0.04); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.18);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.04); osc.stop(now + i * 0.04 + 0.18);
            });
        },
        playError() { 
            if(this.isMuted) return; this.init(); const now = this.ctx.currentTime;
            [160, 140].forEach((f, i) => {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.1);
                gain.gain.setValueAtTime(0.12, now + i * 0.1); gain.gain.linearRampToValueAtTime(0.001, now + i * 0.1 + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.12);
            });
        },
        playSave() { 
            if(this.isMuted) return; this.init(); const now = this.ctx.currentTime;
            const freqs = [587.33, 783.99, 1174.66, 1567.98];
            freqs.forEach((f, i) => {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.05);
                gain.gain.setValueAtTime(0.08, now + i * 0.05); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.25);
            });
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const txt = btn.innerText.toLowerCase();
                if(!txt.includes('scan') && !txt.includes('copy') && !txt.includes('snap') && !txt.includes('rec') && !txt.includes('save') && !txt.includes('🔊')) {
                    SoundFX.playPop();
                }
            });
        });
        document.querySelectorAll('input[type="radio"]').forEach(r => {
            r.addEventListener('change', () => SoundFX.playTick());
        });
    });

    window.onload = function() {
        updateDashboard(); 
        document.getElementById('awb').focus(); 
    };

    // --- ON-DEMAND CAMERA ENGINE (Fixes the Android Scanner Lock) ---
    let globalMediaStream = null; let liveMediaRecorder = null; let recordedChunks = []; let sizeCheckInterval = null;

    async function turnOnCamera() {
        SoundFX.playPop();
        document.getElementById('camera-start-buttons').style.display = 'none';
        document.getElementById('live-media-container').style.display = 'block';
        const video = document.getElementById('live-media-feed'); 
        const status = document.getElementById('mediaStatus');
        
        try {
            status.innerText = "Accessing camera lenses...";
            globalMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
        } catch (err) {
            try {
                globalMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            } catch (err2) {
                status.innerText = "Camera Access Blocked. Update browser permissions."; status.style.color = "var(--danger)"; 
                document.getElementById('camera-start-buttons').style.display = 'flex';
                document.getElementById('live-media-container').style.display = 'none';
                return;
            }
        }
        video.srcObject = globalMediaStream; video.play().catch(e => console.log(e));
        status.innerText = "🟢 Camera Active. Ready to capture."; status.style.color = "var(--success)";
    }

    function turnOffCamera() {
        SoundFX.playPop();
        if (globalMediaStream) {
            globalMediaStream.getTracks().forEach(track => track.stop());
            globalMediaStream = null;
        }
        if (sizeCheckInterval) clearInterval(sizeCheckInterval);
        if (liveMediaRecorder && liveMediaRecorder.state !== "inactive") {
            liveMediaRecorder.stop();
        }
        document.getElementById('live-media-feed').srcObject = null;
        document.getElementById('live-media-container').style.display = 'none';
        document.getElementById('camera-start-buttons').style.display = 'flex';
        
        // Reset recording buttons
        document.getElementById('btn-snap').style.display = 'block'; 
        document.getElementById('btn-rec-start').style.display = 'block'; 
        document.getElementById('btn-rec-stop').style.display = 'none';
        
        const status = document.getElementById('mediaStatus');
        status.innerText = "Camera is turned off.";
        status.style.background = "rgba(255,255,255,0.7)";
        status.style.color = "var(--text-muted)";
    }

    function captureLivePhoto() {
        if (!globalMediaStream) return alert("Please turn on the camera first.");
        SoundFX.playShutter(); 

        const video = document.getElementById('live-media-feed'); const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1280; canvas.height = video.videoHeight || 720;
        const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob((blob) => {
            if(!blob) return; const url = URL.createObjectURL(blob); const a = document.createElement('a');
            const ts = new Date().getTime(); const awbVal = document.getElementById('awb').value || "Claim";
            a.download = `Photo_${awbVal}_${ts}.jpg`; a.href = url;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            
            setTimeout(() => { URL.revokeObjectURL(url); ctx.clearRect(0, 0, canvas.width, canvas.height); }, 1000); // Mobile memory flush
            
            const status = document.getElementById('mediaStatus'); status.innerHTML = `✅ Snap Saved to Storage Engine`;
            setTimeout(() => { if(globalMediaStream) { status.innerText = "🟢 Camera Active. Ready to capture."; status.style.color = "var(--success)"; } }, 2000);
        }, 'image/jpeg', 0.85);
    }

    function startLiveRecording() {
        if (!globalMediaStream) return alert("Please turn on the camera first."); recordedChunks = [];
        SoundFX.playTick();
        
        let options = { mimeType: 'video/mp4' };
        if (!MediaRecorder.isTypeSupported('video/mp4')) options = { mimeType: 'video/webm' };
        try { liveMediaRecorder = new MediaRecorder(globalMediaStream, options); } catch (e) {
            try { liveMediaRecorder = new MediaRecorder(globalMediaStream); } catch (err) { return alert("Codec unsupported."); }
        }
        document.getElementById('btn-snap').style.display = 'none'; document.getElementById('btn-rec-start').style.display = 'none'; document.getElementById('btn-rec-stop').style.display = 'block';
        const status = document.getElementById('mediaStatus'); status.innerHTML = `🔴 RECORDING: 0.00 MB / 23.00 MB`; status.style.color = "var(--danger)";
        liveMediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
        liveMediaRecorder.start(250);
        sizeCheckInterval = setInterval(() => {
            const sizeMB = (new Blob(recordedChunks).size / (1024 * 1024)).toFixed(2);
            status.innerHTML = `🔴 RECORDING: ${sizeMB} MB / 23.00 MB`; if (sizeMB >= 23.00) stopLiveRecording(true);
        }, 250);
    }

    function stopLiveRecording(limitHit = false) {
        if (liveMediaRecorder && liveMediaRecorder.state !== "inactive") liveMediaRecorder.stop();
        clearInterval(sizeCheckInterval);
        document.getElementById('btn-snap').style.display = 'block'; document.getElementById('btn-rec-start').style.display = 'block'; document.getElementById('btn-rec-stop').style.display = 'none';
        const status = document.getElementById('mediaStatus'); status.innerText = "Compiling video container..."; status.style.color = "var(--text-muted)";
        
        setTimeout(() => {
            const finalBlob = new Blob(recordedChunks, { type: liveMediaRecorder.mimeType || 'video/mp4' });
            const finalSizeMB = (finalBlob.size / (1024 * 1024)).toFixed(2);
            const url = URL.createObjectURL(finalBlob); const a = document.createElement('a');
            const ts = new Date().getTime(); const awbVal = document.getElementById('awb').value || "Claim";
            let ext = finalBlob.type.includes("webm") ? "webm" : "mp4";
            a.download = `Video_${awbVal}_${ts}.${ext}`; a.href = url;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            
            setTimeout(() => { URL.revokeObjectURL(url); recordedChunks = []; }, 2000);
            SoundFX.playSave();
            
            status.innerHTML = limitHit ? `✅ Automated strict size boundary ceiling met (${finalSizeMB} MB)` : `✅ Video Container Packaged (${finalSizeMB} MB)`;
            status.style.color = "var(--success)";
            setTimeout(() => { if(globalMediaStream) status.innerText = "🟢 Camera Active. Ready to capture."; }, 3000);
        }, 500); 
    }

    // --- BARCODE SCANNER MECHANICS (600ms Android Fix Included) ---
    async function startScanner(targetField) {
        SoundFX.playTick();
        
        // Fully destroy main camera if running to free the Android hardware lens
        if (globalMediaStream) {
            turnOffCamera();
            document.getElementById('mediaStatus').innerText = "Camera temporarily paused for barcode scanner...";
        }
        
        currentTarget = targetField; 
        document.getElementById('reader-container').style.display = 'block';
        if (html5QrCode && html5QrCode.isScanning) await html5QrCode.stop();
        
        // Wait 600ms for Motorola/Samsung HAL to release the lens completely
        setTimeout(() => {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 260, height: 160 } }, (decodedText) => {
                const text = String(decodedText).trim();
                if (currentTarget === 'awb' && (text.includes('http') || text.includes('{'))) return;
                document.getElementById(currentTarget).value = text;
                if (currentTarget === 'awb') { findSubOrderId(text); checkDuplicate(text); }
                generateTicket(); stopScanner(); SoundFX.playScan();
            }).catch(err => {
                alert("Camera hardware is locked by your phone. Please close background apps or refresh.");
                stopScanner();
            });
        }, 600);
    }

    function stopScanner() {
        SoundFX.playPop();
        if (html5QrCode) {
            html5QrCode.stop().then(() => { 
                document.getElementById('reader-container').style.display = 'none'; 
            });
        } else {
            document.getElementById('reader-container').style.display = 'none'; 
        }
    }

    // --- DATA PIPELINE PARSING ---
    let excelData = []; 
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            excelData = XLSX.utils.sheet_to_json(XLSX.read(data, {type: 'array'}).Sheets[XLSX.read(data, {type: 'array'}).SheetNames[0]], {header: 1});
            const statusBadge = document.getElementById('fileStatus');
            statusBadge.innerText = `✅ Database Connected (${excelData.length} Vectors)`; statusBadge.className = "status-badge status-success";
            SoundFX.playScan();
        }; reader.readAsArrayBuffer(file);
    });

    function findSubOrderId(awbScanned) {
        if (excelData.length === 0) return; const cleanAwb = String(awbScanned).trim().toUpperCase();
        let foundSubId = null; let foundSku = null; let foundQty = null; let foundReason = null;
        for (let r = 0; r < excelData.length; r++) {
            if (excelData[r].join("|||").toUpperCase().includes(cleanAwb)) {
                if (excelData[r].length > 8) foundSubId = String(excelData[r][8]).trim();  
                if (excelData[r].length > 2) foundSku = String(excelData[r][2]).trim();    
                if (excelData[r].length > 6) foundQty = String(excelData[r][6]).trim();  
                if (excelData[r].length > 19) foundReason = String(excelData[r][19]).trim(); 
                break; 
            }
        }
        const subIdBox = document.getElementById('subid'); const skuBox = document.getElementById('sku'); const qtyBox = document.getElementById('qty'); const reasonBox = document.getElementById('fileReason');
        const pSku = document.getElementById('pill-sku'); const pQty = document.getElementById('pill-qty'); const pReason = document.getElementById('pill-reason');
        const tSku = document.getElementById('txt-sku'); const tQty = document.getElementById('txt-qty'); const tReason = document.getElementById('txt-reason');

        if (foundSubId && foundSubId !== "undefined" && foundSubId !== "") {
            subIdBox.value = foundSubId; skuBox.value = foundSku || "N/A"; qtyBox.value = foundQty || "1"; reasonBox.value = foundReason || "N/A";
            tSku.innerText = skuBox.value; tQty.innerText = qtyBox.value; tReason.innerText = reasonBox.value;
            subIdBox.style.borderColor = "var(--success)"; subIdBox.style.backgroundColor = "#f0fdf4";
            pSku.className = "data-pill success-pill"; pQty.className = "data-pill success-pill"; pReason.className = "data-pill success-pill";
            SoundFX.playScan();
        } else {
            subIdBox.value = "NOT FOUND"; skuBox.value = ""; qtyBox.value = ""; reasonBox.value = "";
            tSku.innerText = "No Data"; tQty.innerText = "-"; tReason.innerText = "No Data";
            subIdBox.style.borderColor = "var(--danger)"; subIdBox.style.backgroundColor = "#fff1f2";
            pSku.className = "data-pill error-pill"; pQty.className = "data-pill error-pill"; pReason.className = "data-pill error-pill";
            SoundFX.playError();
        }
        generateTicket(); 
    }

    function manualAwbCheck() { const val = document.getElementById('awb').value.trim(); findSubOrderId(val); checkDuplicate(val); generateTicket(); }

    function copy(id) {
        const field = document.getElementById(id); if(!field.value || field.value.includes("NOT FOUND")) { SoundFX.playError(); return; }
        field.select(); document.execCommand('copy'); SoundFX.playCopy();
        if(id === 'ticketMessage') {
            const btn = document.getElementById('btn-push-meesho'); const orig = btn.innerText;
            btn.innerText = "✨ COPIED TO SYSTEM CLIPBOARD!"; btn.style.background = "var(--success)"; btn.style.boxShadow = "0 10px 20px rgba(16, 185, 129, 0.4)";
            setTimeout(() => { btn.innerText = orig; btn.style.background = "linear-gradient(135deg, #6366f1, #4f46e5)"; btn.style.boxShadow = "0 10px 20px rgba(99, 102, 241, 0.3)"; }, 2000);
        } else {
            const originalBg = field.style.background; field.style.background = "#fef08a";
            setTimeout(() => { field.style.background = originalBg; }, 500);
        }
    }

    // --- DATA STORAGE ENFORCEMENT ---
    function checkDuplicate(awbCheck) {
        const isDupe = smartDB.some(item => item.awb === awbCheck && item.awb !== "");
        document.getElementById('duplicateWarning').style.display = isDupe ? 'block' : 'none';
        if (isDupe) {
            document.getElementById('awb').style.borderColor = "var(--danger)"; document.getElementById('awb').style.backgroundColor = "#fff1f2";
            SoundFX.playError();
        } else {
            document.getElementById('awb').style.borderColor = "rgba(255,255,255,0.6)"; document.getElementById('awb').style.backgroundColor = "rgba(255,255,255,0.7)";
        }
    }

    function logCurrentClaim() {
        const awb = document.getElementById('awb').value; const subid = document.getElementById('subid').value;
        if (!awb || awb.length < 5) { SoundFX.playError(); return alert("Validation error: Invalid AWB."); }
        if (smartDB.some(item => item.awb === awb) && !confirm("Override identical primary key log item data stack index entry constraint?")) { SoundFX.playPop(); return; }

        smartDB.push({ date: new Date().toLocaleString(), awb, subid, type: document.querySelector('input[name="returnType"]:checked')?.value || "Uncategorized" });
        localStorage.setItem('dingtrenSmartDB', JSON.stringify(smartDB));
        SoundFX.playSave(); updateDashboard(); clearForm(); 
    }

    function updateDashboard() {
        document.getElementById('stat-total').innerText = smartDB.length;
        document.getElementById('stat-rto').innerText = smartDB.filter(i => i.type === 'RTO').length;
        document.getElementById('stat-cr').innerText = smartDB.filter(i => i.type === 'Customer Return').length;
        const container = document.getElementById('history-container');
        if (smartDB.length === 0) { container.innerHTML = `<div style="padding: 15px; text-align: center; color: var(--text-muted); font-weight: 600;">Logs clean. Local index empty.</div>`; return; }
        container.innerHTML = smartDB.slice().reverse().map(item => `<div class="history-item"><div><b style="color: var(--text-main)">${item.awb}</b><br><span style="color:var(--text-muted); font-size:10px;">${item.date}</span></div><div style="color: var(--primary); font-weight:800; background: rgba(99,102,241,0.1); padding: 4px 8px; border-radius: 6px; font-size:10px;">${item.type}</div></div>`).join('');
    }

    function exportToCSV() {
        if (smartDB.length === 0) { SoundFX.playError(); return alert("Array index empty."); }
        SoundFX.playSave();
        let csvContent = "data:text/csv;charset=utf-8,Date,AWB,Sub-Order ID,Return Type\n" + smartDB.map(e => `"${e.date}","${e.awb}","${e.subid}","${e.type}"`).join("\n");
        const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `DINGTREN_Claim_Report_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function clearDatabase() { 
        SoundFX.playError();
        if(confirm("Wipe completely?")) { smartDB = []; localStorage.setItem('dingtrenSmartDB', JSON.stringify(smartDB)); updateDashboard(); clearForm(); SoundFX.playPop(); } 
    }

    function clearForm() {
        document.getElementById('awb').value = ''; document.getElementById('subid').value = ''; document.getElementById('pid').value = ''; document.getElementById('sku').value = ''; document.getElementById('qty').value = ''; document.getElementById('fileReason').value = '';
        document.getElementById('txt-sku').innerText = "Waiting..."; document.getElementById('txt-qty').innerText = "-"; document.getElementById('txt-reason').innerText = "Waiting...";
        document.getElementById('pill-sku').className = "data-pill"; document.getElementById('pill-qty').className = "data-pill"; document.getElementById('pill-reason').className = "data-pill";
        ['subid', 'awb'].forEach(id => { const el = document.getElementById(id); if(el) { el.style.borderColor = "rgba(255,255,255,0.6)"; el.style.backgroundColor = "rgba(255,255,255,0.7)"; } });
        document.getElementById('ticketMessage').value = ''; document.getElementById('returnReason').selectedIndex = 0; document.getElementById('duplicateWarning').style.display = 'none';
        const rtoRadio = document.querySelector('input[name="returnType"][value="RTO"]'); const crRadio = document.querySelector('input[name="returnType"][value="Customer Return"]');
        if(rtoRadio) rtoRadio.checked = false; if(crRadio) crRadio.checked = false; document.getElementById('reasonContainer').style.display = 'none';
        
        turnOffCamera();
        document.getElementById('awb').focus(); 
    }

    function toggleReason() { document.getElementById('reasonContainer').style.display = document.querySelector('input[name="returnType"][value="RTO"]').checked ? 'none' : 'block'; }

    function generateTicket() {
        const awb = document.getElementById('awb').value || "[Scan AWB]"; const subId = document.getElementById('subid').value || "[Scan to Auto-fill]";
        const sku = document.getElementById('sku').value && document.getElementById('sku').value !== "N/A" ? document.getElementById('sku').value : "";
        const qty = document.getElementById('qty').value && document.getElementById('qty').value !== "N/A" ? document.getElementById('qty').value : "";
        const fileReason = document.getElementById('fileReason').value && document.getElementById('fileReason').value !== "N/A" ? document.getElementById('fileReason').value : "";
        const pid = document.getElementById('pid').value; const pidText = pid ? `\nPacket ID: ${pid}` : "";
        const returnType = document.querySelector('input[name="returnType"]:checked')?.value;
        let detailedIssue = "";

        if (!returnType) detailedIssue = "Select ticket classification category.";
        else if (returnType === "RTO") detailedIssue = `Issue: RTO Shipment Problem\n\nDescription:\n1. Packaging standard: The product was dispatched in a high-burst-strength 3-ply corrugated box.\n2. Product Nature: High-grade plastic bangle box.\n3. Evidence: I have received an RTO package, but upon opening it on camera, it was found to be damaged/tampered due to courier mishandling during transit.\n\nRequest: Please review the attached unboxing video and approve this claim under the Seller Protection Fund (SPF) due to clear logistic negligence.`;
        else {
            const reason = document.getElementById('returnReason').value;
            if (!reason) detailedIssue = "Select a specific reason from the dropdown.";
            else {
                switch(reason) {
                    case "I have received damaged return": detailedIssue = `Issue: Received Damaged Return\n\nDescription:\n1. Packaging standard: The product was shipped in a high-burst-strength 3-ply corrugated box (industry standard).\n2. Product Nature: This is a high-grade plastic bangle box.\n3. Evidence of Negligence: The cracks/breaks occurred due to extreme external pressure and courier mishandling during transit, which exceeded the protection of a 3-ply box.\n4. Compliance: I have followed all Meesho packaging guidelines. The unboxing video clearly shows the outer package was damaged/mishandled.\n\nRequest: Please approve this claim under the Seller Protection Fund (SPF) as this is a clear case of courier negligence.`; break;
                    case "I have received wrong return": detailedIssue = `Issue: Received Wrong Return\n\nDescription:\nInstead of the high-grade plastic bangle box that was originally dispatched, I have received a completely different and incorrect item. The attached unboxing video clearly demonstrates the intact return packaging being opened to reveal the fraudulent item inside.\n\nRequest: This is a clear case of fraud. Please investigate and approve my SPF claim.`; break;
                    case "Item/s are missing in my return": detailedIssue = `Issue: Items Missing in Return\n\nDescription:\nThe returned package was received partially empty. Some plastic bangle box units from the original order are missing. The continuous unboxing video clearly shows the sealed package being opened and the exact deficit in contents.\n\nRequest: Please process the SPF claim for the missing units based on the attached video evidence.`; break;
                    case "I have received used product as return": detailedIssue = `Issue: Received Used Product\n\nDescription:\nThe customer has returned a used/degraded item instead of the brand new plastic bangle box that was dispatched. This violates the return policy. The unboxing video is attached for your reference.\n\nRequest: Please approve the SPF claim for this unacceptable customer return.`; break;
                    default: detailedIssue = `Issue: ${reason}\n\nDescription:\nI am raising an issue regarding this order. I have securely packaged the original plastic bangle box following all Meesho guidelines. Please review the specific details in the attached unboxing video/photos which serve as clear evidence of the issue at hand.\n\nRequest: Kindly investigate this matter and process the SPF claim accordingly.`;
                }
            }
        }
        let template = `Dear Meesho Support,\n\nAWB Number: ${awb}\nSub-Order ID: ${subId}`;
        if(sku) template += `\nSKU: ${sku}`; if(qty) template += `\nQuantity: ${qty}`; if(fileReason) template += `\nMeesho Listed Reason: ${fileReason}`;
        template += `${pidText}\n\n${detailedIssue}`; document.getElementById('ticketMessage').value = template;
    }
</script>
